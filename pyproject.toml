[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chiba-deck"
version = "0.1.0"
description = "Linux terminal client for the Meshtastic mesh sub-internet"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.47",
    "paho-mqtt>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "rich>=13.0",
]

[project.optional-dependencies]
ble = ["meshtastic>=2.3", "bleak>=0.21"]
payments = ["web3>=7.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
chiba = "chiba.main:run"

[tool.hatch.build.targets.wheel]
packages = ["chiba"]

[tool.hatch.build]
include = [
    "chiba/**",
    "embeddings/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
